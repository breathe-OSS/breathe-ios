name: iOS Build Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
name: Select Xcode
run: |
  sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
  xcodebuild -version
name: Build (no signing)
run: xcodebuild -project Breathe.xcodeproj -scheme Breathe -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO PROVISIONING_PROFILE_SPECIFIER= build
name: Package unsigned IPA
run: |
  mkdir -p ipa/Payload
  cp -R build/Build/Products/Release-iphoneos/BreatheOSS.app ipa/Payload/
  cd ipa && zip -qr ../BreatheOSS-unsigned.ipa Payload
name: Upload unsigned IPA
uses: actions/upload-artifact@v4
with:
  name: BreatheOSS-unsigned
  path: BreatheOSS-unsigned.ipa
  retention-days: 7
