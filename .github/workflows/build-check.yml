name: iOS Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build (no signing)
        run: xcodebuild -project Breathe.xcodeproj -scheme Breathe -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO PROVISIONING_PROFILE_SPECIFIER= build
