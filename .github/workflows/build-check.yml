
name: iOS Build Check

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Archive iOS application
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project Breathe.xcodeproj \
            -scheme Breathe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Breathe.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/Breathe.xcarchive"
          APP="$ARCHIVE/Products/Applications/BreatheOSS.app"

          if [ ! -d "$APP" ]; then
            echo "Application not found in archive"
            find "$ARCHIVE/Products" -maxdepth 3 -print
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          # Remove existing signatures and provisioning profiles.
          find "$APP" -name "_CodeSignature" \
            -type d -prune -exec rm -rf {} +

          find "$APP" -name "embedded.mobileprovision" \
            -type f -delete

          # Construct IPA.
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/BreatheOSS.app"

          cd "$RUNNER_TEMP/ipa"

          zip -r -q "$GITHUB_WORKSPACE/BreatheOSS.ipa" Payload \
            -x "._*" -x ".DS_Store" -x "__MACOSX/*"

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/BreatheOSS.ipa"

      - name: Validate IPA
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/BreatheOSS.ipa"

          unzip -t "$IPA"

          mkdir -p "$RUNNER_TEMP/validation"
          unzip -q "$IPA" -d "$RUNNER_TEMP/validation"

          APP="$RUNNER_TEMP/validation/Payload/BreatheOSS.app"

          test -f "$APP/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$APP/Info.plist")

          test -f "$APP/$EXECUTABLE"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$APP/Info.plist"

          echo "Executable:"
          file "$APP/$EXECUTABLE"

          echo "Architecture:"
          lipo -info "$APP/$EXECUTABLE"

          echo "IPA validation passed."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          path: BreatheOSS.ipa
          archive: false
          retention-days: 7

