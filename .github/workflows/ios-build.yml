name: iOS Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project Breathe.xcodeproj \
            -scheme Breathe \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build          APP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$APP_PLIST")
          APP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$APP_PLIST")
          cp app_profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_UUID.mobileprovision"
          printf 'APP_PROFILE_NAME=%s\n' "$APP_NAME" >> "$GITHUB_ENV"
          
          # Widget Profile
          echo "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > widget_profile.mobileprovision
          WIDGET_PLIST=$(security cms -D -i widget_profile.mobileprovision)
          WIDGET_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$WIDGET_PLIST")
          WIDGET_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$WIDGET_PLIST")
          cp widget_profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_UUID.mobileprovision"
          printf 'WIDGET_PROFILE_NAME=%s\n' "$WIDGET_NAME" >> "$GITHUB_ENV"

      - name: Build archive
        env:
          DEVELOPMENT_TEAM: F76Q3J6F82
        run: |
          xcodebuild \
            -project Breathe.xcodeproj \
            -scheme Breathe \
            -configuration Release \
            -archivePath "$PWD/build/Breathe.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            APP_PROFILE_SPECIFIER="$APP_PROFILE_NAME" \
            WIDGET_PROFILE_SPECIFIER="$WIDGET_PROFILE_NAME" \
            clean archive

      - name: Export IPA
        env:
          EXPORT_METHOD: app-store-connect
          TEAM_ID: F76Q3J6F82
          BUNDLE_ID: com.sidharthify.BreatheOSS
          WIDGET_BUNDLE_ID: com.sidharthify.BreatheOSS.BreatheWidget
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$APP_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key>
              <string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Breathe.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist
          IPA_PATH=$(ls "$PWD/build/export"/*.ipa | head -n 1)
          cp "$IPA_PATH" Breathe.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breathe-${{ github.run_number }}.ipa
          path: Breathe.ipa
          retention-days: 30

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: Breathe.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
