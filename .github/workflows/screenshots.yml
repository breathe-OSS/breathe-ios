name: Simulator Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'Breathe/**'
      - 'BreatheWidget/**'
      - 'Breathe.xcodeproj/**'
      - '.github/scripts/shots.sh'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'Breathe/**'
      - 'BreatheWidget/**'
      - 'Breathe.xcodeproj/**'
      - '.github/scripts/shots.sh'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Build for simulator
        run: |
          xcodebuild \
            -project Breathe.xcodeproj \
            -scheme Breathe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            APP_PROFILE_SPECIFIER= \
            WIDGET_PROFILE_SPECIFIER= \
            build
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Take screenshots
        run: .github/scripts/shots.sh "${{ matrix.device }}" "$APP_PATH" shots

      - name: Collect crash logs
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name '*Breathe*' -print0 2>/dev/null | xargs -0 -I{} cp {} shots/crashes/ || true
          ls shots/crashes

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}-${{ github.run_number }}
          path: shots
          retention-days: 14
