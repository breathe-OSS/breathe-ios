name: Simulator Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'Breathe/**'
      - 'BreatheWidget/**'
      - 'Breathe.xcodeproj/**'
      - '.github/scripts/shots.sh'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'Breathe/**'
      - 'BreatheWidget/**'
      - 'Breathe.xcodeproj/**'
      - '.github/scripts/shots.sh'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      update_readme:
        description: Refresh the README screenshots from this run
        type: boolean
        default: false

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
      bumped: ${{ steps.check.outputs.bumped }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        id: check
        run: .github/scripts/version-bump.sh "${{ github.event.before }}"

  shots:
    needs: version
    runs-on: xcode-27
    timeout-minutes: 30

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad, duo]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Install hinge
        if: matrix.device == 'duo'
        run: |
          git clone --depth 1 --branch v0.3.1 https://github.com/artemnovichkov/hinge.git "$RUNNER_TEMP/hinge"
          echo "HINGE=$RUNNER_TEMP/hinge/bin/hinge" >> "$GITHUB_ENV"

      - name: Build for simulator
        run: |
          xcodebuild \
            -project Breathe.xcodeproj \
            -scheme Breathe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            APP_PROFILE_SPECIFIER= \
            WIDGET_PROFILE_SPECIFIER= \
            build
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: .github/scripts/shots.sh "${{ matrix.device }}" boot

      - name: Take screenshots
        run: .github/scripts/shots.sh "${{ matrix.device }}" "$APP_PATH" shots

      - name: Collect crash logs
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name '*Breathe*' -print0 2>/dev/null | xargs -0 -I{} cp {} shots/crashes/ || true
          ls shots/crashes

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}-${{ github.run_number }}
          path: shots
          retention-days: 14

      - name: Refresh README screenshots
        if: >-
          matrix.device == 'iphone' && github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && needs.version.outputs.bumped == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.update_readme))
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          i=1
          for name in home-light map-zone-light search-light extended-history-light home-dark map-sensors-dark; do
            sips -s format jpeg -s formatOptions 85 --resampleWidth 660 "shots/iphone-$name.png" --out "assets/screenshot-$i.jpg"
            i=$((i + 1))
          done
          if git diff --quiet -- assets; then
            echo "README screenshots unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot-*.jpg
          git commit -s -m "breathe-ios: Refresh README screenshots for $VERSION-$BUILD"
          for _ in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
