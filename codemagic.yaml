workflows:
  ios-build-check:
    name: iOS Build Check
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Select Xcode
        script: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build (no signing)
        script: |
          xcodebuild \
            -project Breathe.xcodeproj \
            -scheme Breathe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e

          mkdir -p ipa/Payload

          cp -R \
            build/Build/Products/Release-iphoneos/BreatheOSS.app \
            ipa/Payload/

          cd ipa
          zip -qr ../BreatheOSS-unsigned.ipa Payload

    artifacts:
      - BreatheOSS-unsigned.ipa
      - build/Build/Products/Release-iphoneos/BreatheOSS.app

