workflows:
  unsigned-ipa:
    name: Unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Archive and package unsigned IPA
        script: |
          set -e

          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            CONTAINER=(-workspace "$WORKSPACE")
          elif [ -n "$PROJECT" ]; then
            CONTAINER=(-project "$PROJECT")
          else
            echo "No Xcode project or workspace found"
            exit 1
          fi

          SCHEME=$(xcodebuild "${CONTAINER[@]}" -list -json | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")

          xcodebuild \
            "${CONTAINER[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "No compiled .app found"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          cd build
          zip -r Unsigned.ipa Payload
          cd ..

    artifacts:
      - build/Unsigned.ipa
      - build/App.xcarchive
